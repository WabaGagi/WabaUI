name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WabaUI.toc ships "@toc-version-forever@" as its Interface value so
      # local dev builds (tools/deploy.sh) can stamp it with whatever the
      # current WoW Forever beta interface number is, without touching
      # committed source every time the beta updates. The packager never runs
      # that script, so resolve the same placeholder here, to the same
      # number, before handing off - bump this alongside tools/deploy.sh's
      # `forever=` value whenever the beta's interface number changes.
      - name: Resolve TOC interface version
        run: sed -i 's/@toc-version-forever@/120100/' WabaUI.toc

      # The packager's own game-type auto-detection only recognizes Forever
      # via a 5-digit "16xxx" interface number (an older, unrelated
      # convention - see release.sh's toc_to_type). This beta's real
      # interface number is 120100 (see tools/deploy.sh), which matches
      # nothing in that table, so auto-detection silently fell through to
      # CurseForge's default "Retail" flavor (game_id 517) instead of
      # Forever's own (88568) - confirmed on the CurseForge file listing
      # after the first two releases. -g forever forces the correct flavor
      # while still using this TOC's actual interface number for the
      # reported game version.
      - uses: BigWigsMods/packager@v2
        with:
          args: -g forever
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
